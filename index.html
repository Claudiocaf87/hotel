<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aclla Sanctuary Lodge · Cusco, Perú</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Preload the hero video so it starts ASAP -->
  <link rel="preload" as="video" href="assets/video largo loopeado.webm" type="video/webm" />

  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --gold: #c5a880;
      --gold-hover: #d4bc99;
      --text-primary: #f0ece4;
      --text-muted: #8a8680;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--text-primary);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    body { min-height: 100vh; }

    /* Hide scrollbars on the horizontal mobile scrollers */
    *::-webkit-scrollbar { display: none; }

    /* Inputs date pickers */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7) sepia(0.5) saturate(2) hue-rotate(5deg);
      cursor: pointer;
    }

    @keyframes scrollDot {
      0%, 100% { transform: scaleY(0.4); transform-origin: top; opacity: 0.4; }
      50% { transform: scaleY(1); transform-origin: top; opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Selection */
    ::selection { background: var(--gold); color: var(--bg); }

    /* Responsive helpers */
    @media (max-width: 767px) {
      .hide-mobile { display: none !important; }
      .show-mobile { display: inline-flex !important; }
      .manifesto-grid {
        grid-template-columns: 1fr !important;
        gap: 3rem !important;
      }
      .amenities-grid {
        grid-template-columns: 1fr !important;
      }
      .testimonials-grid {
        grid-template-columns: 1fr !important;
      }
      .footer-grid {
        grid-template-columns: 1fr !important;
        gap: 2.5rem !important;
      }
      .booking-strip { flex-direction: column !important; }
      .booking-strip label { border-right: none !important; border-bottom: 1px solid rgba(197,168,128,0.35) !important; }
      .booking-strip .reserve-btn { width: 100%; }
      /* Suites stacked on mobile: image on top, text below, no alternation */
      .suite-row {
        grid-template-columns: 1fr !important;
        gap: 1.75rem !important;
      }
      .suite-row > div:first-child {
        grid-column: 1 !important;
        grid-row: auto !important;
      }
      .suite-row > div:last-child {
        grid-column: 1 !important;
        grid-row: auto !important;
      }
    }
    @media (min-width: 768px) and (max-width: 1023px) {
      .amenities-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
      .testimonials-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
      .testimonials-grid > article:nth-child(3) {
        grid-column: 1 / -1;
        max-width: calc(50% - 1rem);
        margin: 0 auto;
      }
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Initial splash to hide raw markup while React mounts */
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      animation: fadeIn 400ms ease;
      transition: opacity 600ms ease;
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
    #boot-splash .mark {
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      letter-spacing: 0.4em;
      color: var(--gold);
      opacity: 0.85;
    }
    #boot-splash .line {
      width: 60px; height: 1px; background: var(--gold);
      margin: 1.25rem auto;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scaleX(0.4); opacity: 0.4; }
      50% { transform: scaleX(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div style="text-align: center;">
      <div class="mark">ACLLA</div>
      <div class="line"></div>
      <div style="font-family: 'Inter', sans-serif; font-size: 0.65rem; letter-spacing: 0.4em; color: var(--text-muted); text-transform: uppercase;">Sanctuary Lodge</div>
    </div>
  </div>

  <div id="root"></div>

  <!-- React + Babel (pinned with integrity) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Translations (plain JS) -->
  <script src="translations.js"></script>

  <!-- Components -->
  <script type="text/babel" data-presets="react" src="app-core.jsx"></script>
  <script type="text/babel" data-presets="react" src="app-sections-1.jsx"></script>
  <script type="text/babel" data-presets="react" src="app-sections-2.jsx"></script>
  <script type="text/babel" data-presets="react" src="app-main.jsx"></script>

  <script>
    // Hide splash once React likely mounted
    window.addEventListener("load", () => {
      setTimeout(() => {
        const s = document.getElementById("boot-splash");
        if (s) {
          s.classList.add("hide");
          setTimeout(() => s.remove(), 700);
        }
      }, 600);
    });
  </script>
</body>
</html>
